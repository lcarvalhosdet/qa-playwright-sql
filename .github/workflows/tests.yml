name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks that need no browser and no database.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements-dev.txt

      - name: Type check
        run: npm run typecheck

      - name: Lint TypeScript
        run: npm run lint

      - name: Lint SQL
        run: npm run lint:sql

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No database service here: global-setup.ts starts PostgreSQL with
      # Testcontainers, using the Docker that the runner already has.
      - name: Run tests
        run: npm test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
