services:
  db:
    # postgres:16 plus pgTAP, for the SQL tests in db/tests
    build: ./db/docker
    image: qa-playwright-sql-postgres:16
    container_name: qa-playwright-db
    # pg_stat_statements must be loaded when the server starts (11_performance.sql)
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    # The schema comes from the migrations: npm run migrate
